name: Render Word to PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.docx"
      - "scripts/Export-WordToPdf.ps1"
      - "scripts/Inspect-WordLayout.ps1"
      - "scripts/Run-WordLayoutQa.ps1"
      - ".github/workflows/render-word.yml"

permissions:
  contents: write

concurrency:
  group: word-render-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, Windows, X64, word]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Discover Word documents
        id: discover
        shell: pwsh
        run: |
          $docs = @(git ls-files -- "*.docx" |
              Where-Object { [System.IO.Path]::GetFileName($_) -notmatch '^~\$' })

          if ($docs.Count -eq 0) {
              "has_docx=false" >> $env:GITHUB_OUTPUT
              Write-Host "No tracked DOCX files found. Nothing to render."
          } else {
              "has_docx=true" >> $env:GITHUB_OUTPUT
              Write-Host "Found $($docs.Count) tracked DOCX file(s):"
              $docs | ForEach-Object { Write-Host "  $_" }
          }

      - name: Render DOCX in place with Microsoft Word
        if: steps.discover.outputs.has_docx == 'true'
        shell: pwsh
        run: |
          ./scripts/Export-WordToPdf.ps1 -InputPath "."

      - name: Run structural layout QA
        if: steps.discover.outputs.has_docx == 'true'
        shell: pwsh
        run: |
          ./scripts/Run-WordLayoutQa.ps1 -InputPath "." -ReportRoot "_qa"

      - name: Prepare generated PDFs for artifact
        if: steps.discover.outputs.has_docx == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item "_artifact" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "_artifact\pdf" -Force | Out-Null
          New-Item -ItemType Directory -Path "_artifact\qa" -Force | Out-Null

          $docs = @(git ls-files -- "*.docx" |
              Where-Object { [System.IO.Path]::GetFileName($_) -notmatch '^~\$' })

          foreach ($docx in $docs) {
              $pdf = [System.IO.Path]::ChangeExtension($docx, ".pdf")
              if (-not (Test-Path -LiteralPath $pdf)) {
                  throw "Expected generated PDF not found: $pdf"
              }

              $dest = Join-Path "_artifact\pdf" $pdf
              $destDir = Split-Path -Parent $dest
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
              Copy-Item -LiteralPath $pdf -Destination $dest -Force
          }

          if (Test-Path "_qa") {
              Copy-Item "_qa\*" "_artifact\qa" -Recurse -Force
          }

      - name: Upload PDFs and QA reports
        if: steps.discover.outputs.has_docx == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: word-render-results
          path: |
            _artifact/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Commit generated PDFs beside source DOCX
        if: steps.discover.outputs.has_docx == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $docs = @(git ls-files -- "*.docx" |
              Where-Object { [System.IO.Path]::GetFileName($_) -notmatch '^~\$' })

          $pdfs = @()
          foreach ($docx in $docs) {
              $pdf = [System.IO.Path]::ChangeExtension($docx, ".pdf")
              if (Test-Path -LiteralPath $pdf) {
                  $pdfs += $pdf
              }
          }

          if ($pdfs.Count -eq 0) {
              Write-Host "No generated PDFs to commit."
              exit 0
          }

          git add -- $pdfs

          if ([string]::IsNullOrWhiteSpace((git status --porcelain))) {
              Write-Host "No generated PDF changes to commit."
              exit 0
          }

          git fetch origin "\${{ github.ref_name }}"
          $localHead = (git rev-parse HEAD).Trim()
          $remoteHead = (git rev-parse "origin/\${{ github.ref_name }}").Trim()

          if ($localHead -ne $remoteHead) {
              Write-Warning "Branch advanced during rendering. Skip committing potentially stale PDFs. The generated files remain available in the workflow artifact."
              exit 0
          }

          git commit -m "自动生成 Word PDF 版式快照 [skip ci]"
          git push origin "HEAD:\${{ github.ref_name }}"
