name: Runner Health Check

on:
  workflow_dispatch:

jobs:
  health:
    runs-on: [self-hosted, Windows, X64, word]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $(whoami)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Git: $(git --version)"

          $word = $null
          try {
              $word = New-Object -ComObject Word.Application
              $word.Visible = $false
              $word.DisplayAlerts = 0
              Write-Host "Microsoft Word: $($word.Version)"
          }
          finally {
              if ($null -ne $word) {
                  try { $word.Quit() } catch {}
                  try { [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($word) } catch {}
              }
          }

      - name: Test an existing DOCX when available
        shell: pwsh
        run: |
          $docxPath = git ls-files -- "*.docx" |
              Where-Object { [System.IO.Path]::GetFileName($_) -notmatch '^~\$' } |
              Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($docxPath)) {
              Write-Host "No tracked DOCX found. Environment check passed; render test skipped."
              exit 0
          }

          $docx = Get-Item -LiteralPath $docxPath
          $testDir = Join-Path $env:RUNNER_TEMP "word-health-check"
          Remove-Item $testDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null

          $testDocx = Join-Path $testDir $docx.Name
          Copy-Item -LiteralPath $docx.FullName -Destination $testDocx

          ./scripts/Export-WordToPdf.ps1 -InputPath $testDocx

          $testPdf = [System.IO.Path]::ChangeExtension($testDocx, ".pdf")
          if (-not (Test-Path -LiteralPath $testPdf)) {
              throw "Health-check PDF was not created."
          }

          Write-Host "Runner health check: PASS"
